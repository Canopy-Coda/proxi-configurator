<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proxi DAW lens</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Proxi DAW lens <span class="poc">exploded-view spike</span></h1>
    <div id="controls">
      <button id="open-btn">Open .mid…</button>
      <input id="file-input" type="file" accept=".mid,.midi,audio/midi" hidden />
      <button id="demo-btn">Load demo take</button>
      <div id="source-toggle" class="segmented" role="tablist" aria-label="Source">
        <button id="seg-file" class="seg" role="tab">File</button>
        <button id="seg-live" class="seg" role="tab">Live</button>
      </div>
      <span id="status">loading…</span>
    </div>
  </header>
  <main>
    <div id="hint">
      Open a <code>.mid</code> recorded from Proxi (or any MIDI file), or listen live —
      the take explodes into per-pedal panels with a named lane per control,
      resolved through the rig. Drag &amp; drop works too.
    </div>
    <div id="panels"></div>
  </main>
  <div id="tooltip"></div>
  <script type="module" src="lens.mjs"></script>
</body>
</html>
