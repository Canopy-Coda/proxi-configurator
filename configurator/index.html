<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- maximum-scale=1 stops iOS Safari's focus auto-zoom on our <16px inputs;
       pinch zoom still works (iOS ≥10 ignores the cap for user gestures) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Proxi Configurator</title>
  <!-- Fonts are vendored (fonts/fonts.css) so the app works fully offline. -->
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <noscript>Proxi Configurator needs JavaScript.</noscript>
  </div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
